server.port=8080

# JPA/Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# DevTools Configuration
spring.devtools.restart.enabled=true

# Configuración común para todos los profiles por defecto
spring.profiles.active=h2

# Debug level Spring
logging.level.org.springframework.web=DEBUG
logging.level.ar.edu.utn.dds=DEBUG

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Metrics
management.datadog.metrics.export.apiKey=${DD_API_KEY:***REMOVED***}
management.datadog.metrics.export.applicationKey=${DD_APP_KEY:***REMOVED***}
management.datadog.metrics.export.enabled=true
management.datadog.metrics.export.step=30s
